0].w[3],L[1].w[0],L[2].w[2],L[3].w[2]];function render(){document.getElementById('stats').textContent=state.xp+' XP · '+state.done.length+'/4 leçons';document.getElementById('progress').value=state.done.length;V.replaceChildren();let l=L[u];if(screen==='home'){el('h2','Unité 1 — Bienvenue au Maroc');el('p','Votre première étape vers le Maroc.');L.forEach((x,j)=>{b((state.done.includes(j)?'✓  ':'0'+(j+1)+'  ')+x.t,()=>start(j),true);el('small',x.g)});let x=b('Mission Maroc — Défi final',()=>{k=0;a=-1;score=0;go('mission')});x.disabled=state.done.length<4;el('small','Terminez les quatre leçons pour débloquer la mission.');return}if(screen==='passport'){el('h2','Mon passeport Darija');el('div',state.stamp?'MISSION MAROC · BIENVENUE — RÉUSSI':'Premier tampon à débloquer','stamp');return}el('h2',['mission','result'].includes(screen)?'Mission Maroc':l.t);if(screen==='dialog'){el('p','Je découvre le dialogue');l.d.forEach(([name,j])=>{let x=el('div','','bubble');el('small',name,'',x);el('strong',l.w[j][0],'',x);el('small',l.w[j][1],'',x)});b('Découvrir les expressions',()=>{k=0;go('learn')})}if(screen==='learn'){let w=l.w[k];el('small','Expression '+(k+1)+'/'+l.w.length);let x=el('div','','panel');el('h2',w[0],'',x);let r=el('div','','parts',x);w[2].split('|').forEach(s=>el('span',s,'',r));el('h2',w[0],'',x);el('p',w[1],'',x);el('p','Répétez trois fois à voix haute.');b(k+1<l.w.length?'Suivant':'Jouer et mémoriser',()=>{if(++k<l.w.length)render();else{k=0;a=-1;go('quiz')}})}if(screen==='quiz'||screen==='mission'){let m=screen==='mission',list=m?Q:l.w,w=list[k],opts=m?[w[0],Q[(k+1)%5][0],Q[(k+2)%5][0]]:l.w.map(x=>x[0]);if(m)opts.push(...opts.splice(0,k%3));let c=opts.indexOf(w[0]);el('small','Défi '+(k+1)+'/'+list.length);el('p','Comment dit-on en darija ?');el('h2',w[1],'panel');opts.forEach((s,j)=>{let x=b(s,()=>{if(a===c||(m&&a!==-1))return;a=j;if(j===c){if(m)score+=4;else award(u+'q'+k,10)}render()},true);if(a===j)x.classList.add(j===c?'good':'bad')});if(a!==-1)el('p',a===c?'Bravo !':m?'Bonne réponse : '+w[0]:'Essayez encore !');let x=b('Continuer',()=>{if(++k<list.length){a=-1;render()}else if(m){if(score>=16){state.stamp=true;award('mission',50);save()}go('result')}else{p=[];go('puzzle')}});x.disabled=m?a===-1:a!==c}if(screen==='puzzle'){let w=l.w[0],parts=w[2].split('|'),ok=p.length===parts.length&&p.every((v,i)=>v===i);el('p','Reconstituez : '+w[1]);el('div',p.map(i=>parts[i]).join(' | ')||'…','panel');let r=el('div','','parts');parts.map((_,i)=>i).reverse().forEach(i=>{let x=b(parts[i],()=>{p.push(i);render()},true,r);x.disabled=p.includes(i)});b('Effacer',()=>{p=[];render()},true);if(p.length===parts.length)el('p',ok?'Excellent !':'Essayez encore !');if(ok)b('Terminer la leçon',()=>{award(u+'p',10);if(!state.done.includes(u))state.done.push(u);save();go('home')})}if(screen==='result'){el('h2',score+'/20','panel');el('p',score>=16?'Mission réussie ! Votre tampon est débloqué.':'Révisez puis réessayez.');b(score>=16?'Mon passeport':'Recommencer',()=>{if(score>=16)go('passport');else{k=0;a=-1;score=0;go('mission')}})}}render();</script></html>
 <script>
const arabic = {
'Assalamou 3alaykoum':'السلام عليكم',
'Wa 3alaykoum assalam':'وعليكم السلام',
'Labas ?':'لاباس',
'Labas, l7amdoullah':'لاباس الحمد لله',
'Smiti Sara':'سميتي سارة',
'Chnou smitk ?':'شنو سميتك',
'W nta ?':'ونتا',
'W nti ?':'ونتي',
'Smiti Youssef':'سميتي يوسف',
'Mnine nta ?':'منين نتا',
'Mnine nti ?':'منين نتي',
'Ana mn Fransa':'أنا من فرنسا',
'Ana mn lmaghrib':'أنا من المغرب',
'Mtcherrfin':'متشرفين',
'Choukran':'شكرا',
'Bslama':'بسلامة',
'Nchoufek mn b3d':'نشوفك من بعد'
};

function speak(word) {
  if (!window.speechSynthesis) {
    alert('Audio non disponible');
    return;
  }
  speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(
    arabic[word] || word
  );
  msg.lang = 'ar-MA';
  msg.rate = 0.75;
  const voices = speechSynthesis.getVoices();
  const voice = voices.find(v => v.lang === 'ar-MA')
    || voices.find(v => v.lang.startsWith('ar'));
  if (voice) msg.voice = voice;
  speechSynthesis.speak(msg);
}

function normalizeArabic(s) {
  return s.replace(/[\u064B-\u065F]/g,'')
    .replace(/[أإآ]/g,'ا')
    .replace(/[^\u0621-\u064A]/g,'');
}

function microphone(word, result) {
  const SR = window.SpeechRecognition
    || window.webkitSpeechRecognition;
  if (!SR) {
    result.textContent =
      'Micro non compatible. Essayez Chrome.';
    return;
  }
  const rec = new SR();
  rec.lang = 'ar-MA';
  rec.maxAlternatives = 5;
  rec.onresult = e => {
    const answers = Array.from(e.results[0]);
    const correct = answers.some(x =>
      normalizeArabic(x.transcript) ===
      normalizeArabic(arabic[word] || word)
    );
    result.textContent = correct
      ? 'Bravo ! Expression reconnue.'
      : 'Reconnu : ' + answers[0].transcript
        + ' — Réessayez : ' + word;
  };
  rec.onerror = () => {
    result.textContent =
      'Vérifiez la permission du microphone.';
  };
  rec.onend = () => {
    if(result.textContent === 'Parlez maintenant…')
      result.textContent = 'Réessayez.';
  };
  result.textContent = 'Parlez maintenant…';
  try { rec.start(); }
  catch(e) {
    result.textContent = 'Micro indisponible.';
  }
}

function audioButtons(word, parent) {
  b('🔊 Écouter', () => speak(word), true, parent);
  const result = el('p', '', '', parent);
  b('🎙️ Parler et vérifier',
    () => microphone(word, result), true, parent);
}

const originalRender = render;
render = function() {
  originalRender();
  if (screen === 'learn') {
    audioButtons(L[u].w[k][0], V);
  }
  if (screen === 'dialog') {
    V.querySelectorAll('.bubble').forEach(x => {
      const word = x.querySelector('strong').textContent;
      b('🔊 Écouter', () => speak(word), true, x);
    });
  }
};
render();
</script>
